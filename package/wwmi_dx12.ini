; wwmi-dx12 settings. Lives in Client\Binaries\Win64, next to the game exe.

[wwmi-dx12]

; Your WWMI folder (the one with d3dx.ini and Mods\). Absolute, or relative to this folder.
; Empty: the launcher asks for it, or searches your drives, and writes it here.
wwmi_dir =

; Logging. 0 = off. 1 = write wwmi_dx12_addon.log next to this file -- turn it on, reproduce the
; problem, and attach the log to your bug report. The overlay's "Debug log" box does the same.
debug = 0
log_level = 2

; Decensor (the overlay's checkbox writes this).
decensor = 0

; The in-game key that makes the add-on read d3dx.ini and every mod ini again -- WWMI's F10 on DX11. A mod
; added, removed or edited with the game running then takes effect without a restart (the add-on drops the
; mods built from the old parse and builds them again). F1..F12, a letter or a digit, or a key name such as
; HOME or END; OFF turns it off. It needs no Shift/Ctrl/Alt, so those combinations stay free for WWMI's own.
reload_key = F10

; 1 = at the next launch, delete the saved shader patches and texture matches (they are rebuilt as you
; play), then set this back to 0. The overlay's "Clear caches" button sets it.
clear_cache = 0

; Troubleshooting only, costs performance: 1 records GPU breadcrumbs, so a GPU crash ("device removed")
; names where it happened.
dred = 0
